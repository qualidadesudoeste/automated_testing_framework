[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-software-testing-framework"
version = "2.0.0"
description = "Testes automatizados de API, regras, interface, UI/UX, performance e segurança"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.45.0"]
visual = ["Pillow>=10.0.0"]
example = ["Flask>=2.3.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
software-test = "run_tests:main"

[tool.setuptools]
py-modules = ["run_tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["testing_framework*", "performance*", "security*"]
